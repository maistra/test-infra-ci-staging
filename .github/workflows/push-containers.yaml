name: Push containers

on:
  push:
    branches: [main]
    paths:
      - "docker/maistra-builder_*.Dockerfile"
      - "docker/scripts/**"
      - "Makefile"
  workflow_dispatch:
    inputs:
      version:
        description: "Builder version to push (e.g. 3.5, main) Leave empty to auto-detect from last push"
        required: false
      use_staging_tags:
        description: "Append -staging to image tags"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  detect-versions:
    runs-on: ubuntu-latest
    outputs:
      needs_push: ${{ steps.detect.outputs.needs_build }}
      matrix_all: ${{ steps.detect.outputs.matrix_all }}
      matrix_multi: ${{ steps.detect.outputs.matrix_multi }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Detect versions to push
        id: detect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          INPUT_VERSION: ${{ inputs.version }}
        with:
          script: |
            const detect = require('./.github/scripts/detect-versions.js');
            const manualVersion = (process.env.INPUT_VERSION || '').trim();
            if (manualVersion) {
              await detect({github, context, core, mode: 'manual', version: manualVersion});
            } else if (context.eventName === 'push') {
              await detect({github, context, core, mode: 'push'});
            } else {
              core.setFailed('workflow_dispatch requires a version input when not triggered by push');
            }

  push-x86:
    needs: detect-versions
    if: needs.detect-versions.outputs.needs_push == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.detect-versions.outputs.matrix_all) }}
    name: "build and push maistra-builder:${{ matrix.version }} (x86_64)"
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Build & Push x86_64 image via Testing Farm
        uses: sclorg/testing-farm-as-github-action@230555baceb860aa468d216f1822974836b965d1 # v4
        with:
          api_key: ${{ secrets.TESTING_FARM_API_TOKEN }}
          api_url: https://api.testing-farm.io/v0.1
          git_url: https://github.com/${{ github.repository }}.git
          git_ref: ${{ github.sha }}
          tmt_plan_regex: ^/plans/push-container$
          compose: CentOS-Stream-10
          arch: x86_64
          # TODO: initial estimates, not empirically validated. Measure and adjust (see "Hardware tuning" section)
          tmt_hardware: '{"memory": ">= 16 GB", "disk": [{"size": ">= 200 GB"}], "cpu": {"processors": ">= 4"}}'
          variables: "BUILDER_VERSION=${{ matrix.version }};PUSH_MODE=${{ matrix.push_mode }};USE_STAGING_TAGS=${{ inputs.use_staging_tags || 'false' }}"
          secrets: "QUAY_USER=maistra-dev+prow;QUAY_PASS=${{ secrets.QUAY_PASSWORD }}"
          timeout: 300
  push-arm:
    needs: detect-versions
    if: needs.detect-versions.outputs.needs_push == 'true' && fromJSON(needs.detect-versions.outputs.matrix_multi)[0] != null
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.detect-versions.outputs.matrix_multi) }}
    name: "build and push maistra-builder:${{ matrix.version }} (aarch64)"
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Push aarch64 image via Testing Farm
        uses: sclorg/testing-farm-as-github-action@230555baceb860aa468d216f1822974836b965d1 # v4
        with:
          api_key: ${{ secrets.TESTING_FARM_API_TOKEN }}
          api_url: https://api.testing-farm.io/v0.1
          git_url: https://github.com/${{ github.repository }}.git
          git_ref: ${{ github.sha }}
          tmt_plan_regex: ^/plans/push-container$
          compose: CentOS-Stream-10
          arch: aarch64
          # TODO: initial estimates, not empirically validated. Measure and adjust (see "Hardware tuning" section)
          tmt_hardware: '{"memory": ">= 16 GB", "disk": [{"size": ">= 200 GB"}], "cpu": {"processors": ">= 4"}}'
          variables: "BUILDER_VERSION=${{ matrix.version }};PUSH_MODE=${{ matrix.push_mode }};USE_STAGING_TAGS=${{ inputs.use_staging_tags || 'false' }}"
          secrets: "QUAY_USER=maistra-dev+prow;QUAY_PASS=${{ secrets.QUAY_PASSWORD }}"
          timeout: 300

  create-manifest:
    needs: [detect-versions, push-x86, push-arm]
    if: needs.detect-versions.outputs.needs_push == 'true' && fromJSON(needs.detect-versions.outputs.matrix_multi)[0] != null
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-versions.outputs.matrix_multi) }}
    name: "manifest maistra-builder:${{ matrix.version }}"
    steps:
      - name: Login to quay.io
        run: docker login -u="maistra-dev+prow" -p="${{ secrets.QUAY_PASSWORD }}" quay.io
      - name: Create and push manifest
        env:
          VERSION: ${{ matrix.version }}
          STAGING: ${{ inputs.use_staging_tags == true && '-staging' || ''}}
        run: |
          HUB=quay.io/maistra-dev
          TAG="${VERSION}${STAGING}"
          docker manifest create "${HUB}/maistra-builder:${TAG}" \
            "${HUB}/maistra-builder:${TAG}-x86_64" \
            "${HUB}/maistra-builder:${TAG}-aarch64"
          docker manifest push "${HUB}/maistra-builder:${TAG}"
          echo "Manifest pushed: ${HUB}/maistra-builder:${TAG}"
